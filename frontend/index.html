<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer - Tingkat Lanjut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Styling khusus untuk output Markdown agar tidak terlihat berantakan */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #1f2937; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code { background-color: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875em; color: #ef4444; }
        .markdown-body pre { background-color: #1f2937; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .markdown-body pre code { background-color: transparent; color: inherit; padding: 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col">

    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider">AI CODE REVIEWER</h1>
        <button id="reviewBtn" onclick="review()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-6 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Jalankan Review
        </button>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <section class="w-full md:w-1/2 flex flex-col bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
            <div class="bg-gray-100 border-b border-gray-200 p-2 text-sm font-semibold text-gray-600">
                Tempel Kode Python Anda Di Sini
            </div>
            <textarea id="code" class="flex-grow p-4 font-mono text-sm bg-gray-50 outline-none resize-none focus:ring-2 focus:ring-blue-500" spellcheck="false" placeholder="def hello_world():&#10;    print('Tulis kode busuk Anda di sini...')"></textarea>
        </section>

        <section class="w-full md:w-1/2 flex flex-col bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
            <div class="bg-gray-100 border-b border-gray-200 p-2 text-sm font-semibold text-gray-600">
                Laporan Analisis
            </div>
            <div id="resultContainer" class="flex-grow p-6 overflow-y-auto hidden">
                
                <div class="mb-6">
                    <h2 class="text-lg font-bold text-red-600 border-b border-red-200 pb-2 mb-3">Analisis Statis (Linter)</h2>
                    <ul id="staticResult" class="list-disc pl-5 text-sm font-mono text-gray-700 bg-red-50 p-4 rounded-md border border-red-100">
                        </ul>
                </div>

                <div>
                    <h2 class="text-lg font-bold text-blue-600 border-b border-blue-200 pb-2 mb-3">Tinjauan AI (Deep Dive)</h2>
                    <div id="aiResult" class="markdown-body text-sm text-gray-700 leading-relaxed">
                        </div>
                </div>

            </div>

            <div id="statusMessage" class="flex-grow flex items-center justify-center text-gray-400 p-6 text-center">
                Sistem siap. Masukkan kode dan tekan 'Jalankan Review'.
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

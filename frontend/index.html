<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Glassmorphism & Depth */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Editor Styling */
        #code {
            background-image: repeating-linear-gradient(transparent, transparent 23px, #f1f5f9 24px);
            line-height: 24px;
            background-attachment: local;
        }

        /* Markdown Typography Enhancements */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; color: #111827; letter-spacing: -0.025em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; margin-top: 1.5rem; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 1.25rem; line-height: 1.7; color: #374151; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; color: #374151; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1.25rem; color: #374151; }
        .markdown-body li { margin-bottom: 0.5rem; }
        .markdown-body code { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.375rem; font-family: 'Courier New', Courier, monospace; font-size: 0.875em; color: #b91c1c; font-weight: 500; }
        .markdown-body pre { background-color: #0f172a; color: #e2e8f0; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.5rem; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); }
        .markdown-body pre code { background-color: transparent; color: inherit; padding: 0; font-size: 0.9em; font-weight: 400; }
        .markdown-body blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; font-style: italic; color: #64748b; margin-bottom: 1.25rem; }

        /* Processing Animation */
        .processing-pulse {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { border-color: #93c5fd; box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-gray-50 text-gray-800 font-sans h-screen flex flex-col selection:bg-blue-200 selection:text-blue-900">

    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center border-b border-slate-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold shadow-lg">AI</div>
            <h1 class="text-xl font-bold tracking-wide text-slate-100">Code Diagnostics</h1>
        </div>
        <button id="reviewBtn" onclick="review()" class="bg-white text-slate-900 hover:bg-slate-200 font-semibold py-2 px-6 rounded-md transition-all duration-200 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Run Analysis
        </button>
    </header>

    <main class="flex-grow flex flex-col md:flex-row p-4 md:p-6 gap-6 overflow-hidden relative z-10">
        
        <section class="w-full md:w-1/2 flex flex-col glass-panel rounded-xl overflow-hidden transition-all duration-300" id="editorSection">
            <div class="bg-white/50 border-b border-slate-200 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider flex justify-between items-center">
                <span>Target Source Code (Python)</span>
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-slate-500"></span>
                </span>
            </div>
            <textarea id="code" class="flex-grow p-5 font-mono text-[14px] bg-transparent outline-none resize-none focus:ring-0 text-slate-800" spellcheck="false" placeholder="# Insert your questionable code here...&#10;&#10;def analyze_this():&#10;    pass"></textarea>
        </section>

        <section class="w-full md:w-1/2 flex flex-col glass-panel rounded-xl overflow-hidden">
            <div class="bg-white/50 border-b border-slate-200 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider">
                Diagnostic Report
            </div>
            
            <div id="resultContainer" class="flex-grow p-6 overflow-y-auto hidden">
                
                <div class="mb-8">
                    <div class="flex items-center gap-2 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                        <h2 class="text-lg font-bold text-slate-800">Static Analysis</h2>
                    </div>
                    <ul id="staticResult" class="list-none space-y-2 text-sm font-mono text-slate-700 bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        </ul>
                </div>

                <div>
                    <div class="flex items-center gap-2 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
                        </svg>
                        <h2 class="text-lg font-bold text-slate-800">AI Deep Dive</h2>
                    </div>
                    <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-sm">
                        <div id="aiResult" class="markdown-body text-sm">
                            </div>
                    </div>
                </div>

            </div>

            <div id="statusMessage" class="flex-grow flex flex-col items-center justify-center text-slate-400 p-8 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <p class="text-sm font-medium tracking-wide">System idle. Awaiting payload.</p>
            </div>
        </section>

    </main>

    <script>
        // Store original review function reference
        const originalReview = typeof review === 'function' ? review : () => console.error("script.js is not loaded properly.");
        
        // Wrap it to add CSS animation triggers
        window.review = async function() {
            const editor = document.getElementById('editorSection');
            editor.classList.add('processing-pulse');
            await originalReview();
            editor.classList.remove('processing-pulse');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
